<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>必要スラブ厚さ かんたん入力｜重量床衝撃音</title>
<meta name="description" content="質問に答えるだけで、目標の重量床衝撃音等級（LH）を満たすスラブの等価厚を求めます。梁の条件は81通りすべてを計算し、安全側と分布を示します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F2; --sheet:#FAFBFB; --ink:#1B2540; --ink-soft:#4E5A75; --line:#2F45A3; --line-soft:rgba(47,69,163,.36);
  --rule:#CBD3E1; --grid:#E0E5EE; --shu:#C23A1E; --pass:rgba(47,69,163,.08); --field:#FFFFFF; --field-line:#AEB8CC; --focus:#2F45A3;
  --q0:#2F45A3; --q1:#6F80C4; --q2:#A59AAE; --q3:#D8825F; --q4:#C23A1E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12264D; --sheet:#152D58; --ink:#EEF2FA; --ink-soft:#B3C1DE; --line:#D3DEF6; --line-soft:rgba(211,222,246,.42);
    --rule:rgba(211,222,246,.22); --grid:rgba(211,222,246,.11); --shu:#FF8C6B; --pass:rgba(211,222,246,.08); --field:#1A3767; --field-line:rgba(211,222,246,.35); --focus:#FFD27A;
    --q0:#D3DEF6; --q1:#98AAE2; --q2:#B6A8C2; --q3:#F2B49B; --q4:#FF7A55;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 "BIZ UDPGothic",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--line);text-underline-offset:2px}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.page{max-width:820px;margin:0 auto;padding:22px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:17px;font-weight:700}
.top a{font-size:14px}

/* progress */
.progress{display:flex;align-items:center;gap:14px;margin-bottom:26px;min-height:34px}
.back{border:0;background:none;color:var(--line);cursor:pointer;padding:4px 0;font-size:15px}
.back:disabled{visibility:hidden}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:4px;background:var(--rule);border-radius:2px}
.dots i.done{background:var(--line)}
.count{font-size:13px;color:var(--ink-soft);white-space:nowrap}

/* slides */
.slide{display:grid;gap:18px;animation:slideIn .32s cubic-bezier(.2,.7,.2,1) both}
.slide.from-left{animation-name:slideInLeft}
@keyframes slideIn{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
.q{font-size:28px;line-height:1.4;font-weight:700;outline:none}
.q small{display:block;font-size:15px;font-weight:400;color:var(--ink-soft);margin-top:8px;line-height:1.7}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choice{border:1.5px solid var(--line-soft);background:var(--sheet);border-radius:6px;padding:16px 12px;cursor:pointer;text-align:center;font-size:22px;font-weight:700;color:var(--ink)}
.choice small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-soft);margin-top:2px}
.choice:hover{border-color:var(--line)}
.choice[aria-pressed="true"]{border-color:var(--line);background:var(--pass);box-shadow:inset 0 0 0 1px var(--line)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .choice{font-size:19px;padding:18px 14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;font-size:14px;color:var(--ink-soft);min-width:0}
.field input{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--field-line);border-radius:5px;background:var(--field);font-size:18px;color:var(--ink)}
.field.invalid input{border-color:var(--shu);box-shadow:0 0 0 1px var(--shu)}
.err{color:var(--shu);font-size:14px}
.err:empty{display:none}
.help{font-size:14px;color:var(--ink-soft)}
.next{justify-self:start;border:0;background:var(--line);color:var(--sheet);padding:11px 26px;border-radius:5px;font-weight:700;cursor:pointer;font-size:16px}
.reveal{display:grid;gap:14px;padding-top:4px}
.mats{display:grid;gap:8px}
.mat{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line-soft);background:var(--sheet);border-radius:6px;padding:11px 14px;cursor:pointer}
.mat input{width:18px;height:18px;accent-color:var(--line);flex:none}
.mat b{display:block;font-size:16px}
.mat span{font-size:13px;color:var(--ink-soft)}
.mat:has(input:checked){border-color:var(--line);background:var(--pass)}

/* result */
.result{display:grid;gap:30px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:4px 28px;align-items:end;padding:18px 20px;background:var(--sheet);border:1px solid var(--rule);border-radius:2px}
.hero .lab{font-size:14px;color:var(--ink-soft)}
.hero .big{font-size:58px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.hero .big span{font-size:20px;font-weight:400;margin-left:4px}
.hero .safe .big{color:var(--shu)}
.hero .sub{grid-column:1/-1;font-size:15px;color:var(--ink-soft);margin-top:10px}
.block{display:grid;gap:10px;min-width:0}
.block h2{font-size:19px;font-weight:700}
.lead{font-size:14.5px;color:var(--ink-soft)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--ink-soft);font-weight:700}
td.num{text-align:right;font-weight:700;white-space:nowrap}
td.num.none{color:var(--shu)}
tr.safe td{color:var(--shu)}
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-soft);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.slider{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.slider input{width:100%;accent-color:var(--line)}
.slider output{font-size:15px}
.slider output b{font-size:19px}
.combos{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.combo{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.combo b{margin-left:auto;font-size:16px;white-space:nowrap}
.recap{display:grid;gap:0}
.recap div{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
.recap dt{width:8.5em;color:var(--ink-soft);flex:none}
.recap dd{margin:0;flex:1}
.recap button{border:0;background:none;color:var(--line);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line-soft);background:transparent;color:var(--line);padding:8px 14px;border-radius:4px;cursor:pointer;font-size:14.5px;text-decoration:none}
.btn.primary{background:var(--line);color:var(--sheet);border-color:var(--line)}
.notes{font-size:13.5px;color:var(--ink-soft)}
.notes ul{margin:6px 0 0;padding-left:1.3em;display:grid;gap:5px}
.computing{font-size:15px;color:var(--ink-soft)}
/* SVG tokens */
.s-ink{stroke:var(--ink)}.s-line{stroke:var(--line)}.s-grid{stroke:var(--grid)}.s-shu{stroke:var(--shu)}.s-paper{stroke:var(--sheet)}
.f-ink{fill:var(--ink)}.f-soft{fill:var(--ink-soft)}.f-shu{fill:var(--shu)}.f-paper{fill:var(--sheet)}.f-pass{fill:var(--pass)}.f-none{fill:none}
.f-q0{fill:var(--q0)}.f-q1{fill:var(--q1)}.f-q2{fill:var(--q2)}.f-q3{fill:var(--q3)}.f-q4{fill:var(--q4)}
svg text{font-family:"BIZ UDPGothic",system-ui,sans-serif}
@media (max-width:620px){
  .page{padding:16px 14px 56px}.q{font-size:23px}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}.hero .big{font-size:48px}.combos{grid-template-columns:1fr}.field input{font-size:17px}
  .recap dt{width:6.5em}
}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
@media print{body{background:#fff}.progress,.actions,.top a,.slider{display:none!important}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>必要なスラブ厚さ（かんたん入力）</h1>
    <a href="slab-thickness.html" id="toDetail">詳細入力版</a>
  </div>

  <nav class="progress" aria-label="進み具合">
    <button type="button" class="back" id="back">戻る</button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <span class="count" id="count"></span>
  </nav>

  <main id="stage" aria-live="polite"></main>
</div>

<script src="slab-thickness-core.js"></script>
<script>
(() => {
'use strict';
const M = window.SlabModel, C = window.SlabCharts;
const $ = id => document.getElementById(id);
const fm = v => (Math.round(v * 100) / 100).toFixed(2);
const fE = E => (E / 1e10).toFixed(2);
const mat = id => M.MATERIALS.find(m => m.id === id) || M.MATERIALS[0];
const defMat = mat(M.DEFAULTS.material);

const state = {target: null, Lx: null, Ly: null, same: null, rx: null, ry: null, T: null, H: null, material: null};
const STEPS = ['target', 'slab', 'room', 'T', 'H', 'material', 'result'];
let step = 0, dir = 1, sw = null, dist = null, cursor = null;

/* ---------- slide renderers ---------- */
const slides = {
  target() {
    const opts = [40, 45, 50, 55, 60, 65];
    return `<h2 class="q" tabindex="-1">目標の性能は？<small>重量床衝撃音の等級（LH）です。数字が小さいほど遮音性能が高くなります。</small></h2>
      <div class="choices">${opts.map(v => `<button type="button" class="choice" data-target="${v}" aria-pressed="${state.target === v}">LH-${v}</button>`).join('')}</div>`;
  },
  slab() {
    return `<h2 class="q" tabindex="-1">スラブの大きさは？<small>梁で囲まれた1枚の床スラブの寸法を入れてください。</small></h2>
      <div class="fields">
        <label class="field" id="f-Lx">短辺 [m]<input id="Lx" type="number" inputmode="decimal" step="any" value="${state.Lx ?? ''}" placeholder="例 4.5"></label>
        <label class="field" id="f-Ly">長辺 [m]<input id="Ly" type="number" inputmode="decimal" step="any" value="${state.Ly ?? ''}" placeholder="例 5.5"></label>
      </div>
      <p class="err" id="err"></p>
      <button type="button" class="next" id="next">次へ</button>`;
  },
  room() {
    const no = state.same === false;
    return `<h2 class="q" tabindex="-1">下の部屋は、スラブと同じ大きさでいいですか？<small>部屋の位置が分からなくても大丈夫です。スラブの端と中央に寄せた配置を計算し、最も厳しい配置で評価します。</small></h2>
      <div class="yn">
        <button type="button" class="choice" data-yn="yes" aria-pressed="${state.same === true}">はい<small>${fm(state.Lx)} × ${fm(state.Ly)} m</small></button>
        <button type="button" class="choice" data-yn="no" aria-pressed="${no}">いいえ<small>部屋の寸法を入れる</small></button>
      </div>
      <div class="reveal" id="reveal" ${no ? '' : 'hidden'}>
        <div class="fields">
          <label class="field" id="f-rx">幅（スラブ短辺の方向）[m]<input id="rx" type="number" inputmode="decimal" step="any" value="${state.rx ?? ''}"></label>
          <label class="field" id="f-ry">奥行（スラブ長辺の方向）[m]<input id="ry" type="number" inputmode="decimal" step="any" value="${state.ry ?? ''}"></label>
        </div>
        <p class="help">部屋がスラブより広い方向では、加振するスラブ1枚だけを計算します（隣のスラブは含みません）。</p>
        <p class="err" id="err"></p>
        <button type="button" class="next" id="next">次へ</button>
      </div>`;
  },
  T() { return ynSlide('T', '残響時間は 0.5 秒でいいですか？', '下の部屋の残響時間です。吸音力 A = 0.161 V / T の計算に使います。', '0.5 秒', '残響時間 [s]', M.DEFAULTS.T); },
  H() { return ynSlide('H', '天井高は 2.5 m でいいですか？', '下の部屋の天井高です。室容積の計算に使います。', '2.5 m', '天井高 [m]', M.DEFAULTS.H); },
  material() {
    const no = state.material !== null && state.material !== defMat.id;
    const showList = no || state._matNo;
    return `<h2 class="q" tabindex="-1">スラブの材料は「${defMat.label}」でいいですか？<small>密度 ${defMat.rho.toLocaleString()} kg/m³・ヤング率 ${fE(defMat.E)}×10¹⁰ N/m²。この材料の均質な板として等価厚を求めます。</small></h2>
      <div class="yn">
        <button type="button" class="choice" data-yn="yes" aria-pressed="${state.material === defMat.id && !showList}">はい<small>${defMat.note}</small></button>
        <button type="button" class="choice" data-yn="no" aria-pressed="${!!showList}">いいえ<small>ほかの材料から選ぶ</small></button>
      </div>
      <div class="reveal" id="reveal" ${showList ? '' : 'hidden'}>
        <div class="mats" role="radiogroup" aria-label="材料">
          ${M.MATERIALS.map(m => `<label class="mat"><input type="radio" name="mat" value="${m.id}" ${state.material === m.id ? 'checked' : ''}><div><b>${m.label}</b><span>ρ ${m.rho.toLocaleString()} kg/m³・E ${fE(m.E)}×10¹⁰ N/m²</span></div></label>`).join('')}
        </div>
        <p class="help">ヤング率は日本建築学会 RC 規準の式 E = 3.35×10⁴ (γ/24)² (Fc/60)^1/3 [N/mm²] による代表値です（Fc36 相当は元の計算コードの値）。</p>
        <p class="err" id="err"></p>
        <button type="button" class="next" id="next">計算する</button>
      </div>`;
  },
  result() { return `<p class="computing" tabindex="-1">計算しています…</p>`; }
};

function ynSlide(key, q, help, yesLabel, inputLabel, def) {
  const no = state[key] !== null && state[key] !== def;
  const showInput = no || state['_' + key + 'No'];
  return `<h2 class="q" tabindex="-1">${q}<small>${help}</small></h2>
    <div class="yn">
      <button type="button" class="choice" data-yn="yes" aria-pressed="${state[key] === def && !showInput}">はい<small>${yesLabel}</small></button>
      <button type="button" class="choice" data-yn="no" aria-pressed="${!!showInput}">いいえ<small>値を入れる</small></button>
    </div>
    <div class="reveal" id="reveal" ${showInput ? '' : 'hidden'}>
      <div class="fields"><label class="field" id="f-v">${inputLabel}<input id="v" type="number" inputmode="decimal" step="any" value="${no ? state[key] : ''}"></label></div>
      <p class="err" id="err"></p>
      <button type="button" class="next" id="next">次へ</button>
    </div>`;
}

/* ---------- navigation ---------- */
function go(i, d) {
  dir = d ?? (i >= step ? 1 : -1);
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  render();
}
function render() {
  const name = STEPS[step];
  const stage = $('stage');
  stage.innerHTML = `<section class="slide ${dir < 0 ? 'from-left' : ''}">${slides[name]()}</section>`;
  $('dots').innerHTML = STEPS.slice(0, -1).map((_, i) => `<i class="${i < step ? 'done' : ''}"></i>`).join('');
  $('count').textContent = name === 'result' ? '結果' : `${step + 1} / ${STEPS.length - 1}`;
  $('back').disabled = step === 0;
  wire(name);
  const h = stage.querySelector('[tabindex="-1"]');
  if (h) h.focus({preventScroll: true});
  window.scrollTo({top: 0, behavior: 'instant' in window ? 'instant' : 'auto'});
  if (name === 'result') setTimeout(computeResult, 30);
}
$('back').addEventListener('click', () => go(step - 1, -1));

function num(id) { const el = $(id); return el && el.value.trim() !== '' ? Number(el.value) : NaN; }
function bad(id, on) { $('f-' + id)?.classList.toggle('invalid', on); }
function onEnter(handler) { $('stage').querySelectorAll('input[type=number]').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handler(); } })); }

function wire(name) {
  const stage = $('stage');
  if (name === 'target') {
    stage.querySelectorAll('[data-target]').forEach(b => b.addEventListener('click', () => { state.target = Number(b.dataset.target); go(step + 1); }));
  }
  if (name === 'slab') {
    const next = () => {
      let a = num('Lx'), b = num('Ly');
      bad('Lx', !(a > 0)); bad('Ly', !(b > 0));
      if (!(a > 0) || !(b > 0)) { $('err').textContent = '短辺と長辺に正の数を入れてください。'; return; }
      if (a > b) [a, b] = [b, a];
      state.Lx = a; state.Ly = b;
      if (state.same !== false) { state.rx = a; state.ry = b; }
      go(step + 1);
    };
    $('next').addEventListener('click', next); onEnter(next);
    $('Lx').focus();
  }
  if (name === 'room') {
    stage.querySelector('[data-yn="yes"]').addEventListener('click', () => { state.same = true; state.rx = state.Lx; state.ry = state.Ly; go(step + 1); });
    stage.querySelector('[data-yn="no"]').addEventListener('click', () => {
      state.same = false; $('reveal').hidden = false;
      stage.querySelector('[data-yn="no"]').setAttribute('aria-pressed', 'true'); stage.querySelector('[data-yn="yes"]').setAttribute('aria-pressed', 'false');
      $('rx').focus();
    });
    const next = () => {
      const a = num('rx'), b = num('ry');
      bad('rx', !(a > 0)); bad('ry', !(b > 0));
      if (!(a > 0) || !(b > 0)) { $('err').textContent = '幅と奥行に正の数を入れてください。'; return; }
      state.rx = a; state.ry = b; go(step + 1);
    };
    $('next').addEventListener('click', next); onEnter(next);
  }
  if (name === 'T' || name === 'H') {
    const def = M.DEFAULTS[name];
    stage.querySelector('[data-yn="yes"]').addEventListener('click', () => { state[name] = def; state['_' + name + 'No'] = false; go(step + 1); });
    stage.querySelector('[data-yn="no"]').addEventListener('click', () => {
      state['_' + name + 'No'] = true; $('reveal').hidden = false;
      stage.querySelector('[data-yn="no"]').setAttribute('aria-pressed', 'true'); stage.querySelector('[data-yn="yes"]').setAttribute('aria-pressed', 'false');
      $('v').focus();
    });
    const next = () => {
      const v = num('v'), ok = name === 'T' ? v > 0 && v <= 10 : v > 0 && v <= 20;
      bad('v', !ok);
      if (!ok) { $('err').textContent = name === 'T' ? '残響時間は 0〜10 秒の数を入れてください。' : '天井高は 0〜20 m の数を入れてください。'; return; }
      state[name] = v; go(step + 1);
    };
    $('next').addEventListener('click', next); onEnter(next);
  }
  if (name === 'material') {
    stage.querySelector('[data-yn="yes"]').addEventListener('click', () => { state.material = defMat.id; state._matNo = false; go(step + 1); });
    stage.querySelector('[data-yn="no"]').addEventListener('click', () => {
      state._matNo = true; $('reveal').hidden = false;
      stage.querySelector('[data-yn="no"]').setAttribute('aria-pressed', 'true'); stage.querySelector('[data-yn="yes"]').setAttribute('aria-pressed', 'false');
      (stage.querySelector('input[name=mat]:checked') || stage.querySelector('input[name=mat]')).focus();
    });
    $('next').addEventListener('click', () => {
      const sel = stage.querySelector('input[name=mat]:checked');
      if (!sel) { $('err').textContent = '材料を1つ選んでください。'; return; }
      state.material = sel.value; go(step + 1);
    });
  }
}

/* ---------- result ---------- */
function config() {
  const m = mat(state.material);
  return {Lx: state.Lx, Ly: state.Ly, rx: state.rx, ry: state.ry, H: state.H, T: state.T, rho: m.rho, E: m.E,
    avg: 'arith', base: M.BASES.reference, tol: 0, hmin: M.DEFAULTS.hmin, hmax: M.DEFAULTS.hmax, target: state.target,
    posMode: 'unknown', ox: 0, oy: 0, edgeChoice: {top: 'unknown', btm: 'unknown', left: 'unknown', right: 'unknown'}};
}

function computeResult() {
  const c = config();
  sw = M.sweep(c);
  dist = M.distribution(sw, c.target);
  cursor = dist.median ?? dist.min ?? c.hmax;
  renderResult(c);
  writeUrl();
}

const mmText = (v, c) => v === null ? `${c.hmax} mm 超` : `${v} mm`;

function renderResult(c) {
  const nPos = M.positionsFor(c).length;
  const limits = M.byNoneLimit(sw, dist);
  const bestI = dist.order[dist.order.length - 1], worstI = dist.order[0];
  const best = sw.combos[bestI], worst = sw.combos[worstI];
  const atSafe = dist.max ?? c.hmax;
  const worstPos = M.comboPosAt(sw, worstI, atSafe), worstPosMatters = nPos > 1 && M.comboPosMatters(sw, worstI, atSafe);
  const nTie = dist.max === null ? dist.unmet : dist.ties(dist.max);
  const posNote = (i, h) => nPos <= 1 ? '' : (M.comboPosMatters(sw, i, h) ? `部屋は${M.placeText(c, M.comboPosAt(sw, i, h))}のとき` : '部屋の位置によらない');
  const caseText = nPos > 1 ? `${dist.n} 通り。部屋の位置は ${nPos} 通りの配置のうち、組合せごとに最も厳しいものを使用` : `${dist.n} 通り`;
  const safe = dist.max;
  const rows = [
    ['4辺とも梁あり（大ばり・小ばり）', limits[0]], ['梁なしが1辺まで', limits[1]], ['梁なしが2辺まで', limits[2]],
    ['梁なしが3辺まで', limits[3]], ['すべての組合せ（安全側）', limits[4]]
  ];
  const s = [];
  s.push(`<section class="slide result ${dir < 0 ? 'from-left' : ''}">`);
  s.push(`<h2 class="q" tabindex="-1">LH-${c.target} に必要な等価厚<small>スラブ周辺の梁（大ばり・小ばり・梁なし）を4辺すべての組合せで計算しました（${caseText}）。</small></h2>`);
  s.push(`<div class="hero">
      <div class="safe"><p class="lab">安全側（どの組合せでも満たす）</p><p class="big">${safe === null ? `${c.hmax}<span>mm 超</span>` : `${safe}<span>mm</span>`}</p></div>
      <div><p class="lab">最も有利な組合せなら</p><p class="big">${dist.min === null ? '—' : `${dist.min}<span>mm</span>`}</p></div>
      <p class="sub">${dist.min !== null ? `梁の条件しだいで ${dist.min}〜${mmText(safe, c)} の幅があります。` : ''}半数の組合せは ${mmText(dist.median, c)} で満たします。安全側の値になる組合せは ${nTie} 通りで、たとえば ${M.describeEdges(worst.edges)}${nPos > 1 ? (worstPosMatters ? `（部屋は${M.placeText(c, worstPos)}）` : '（部屋の位置によらない）') : ''} の場合です。</p>
    </div>`);
  s.push(`<div class="block"><h2>梁の条件ごとの必要厚</h2>
      <p class="lead">梁なしの辺が多いほど厚さが必要になります。設計で梁が決まっている範囲に合わせて読んでください。</p>
      <table><thead><tr><th>梁の条件</th><th style="text-align:right">組合せ</th><th style="text-align:right">必要な等価厚</th></tr></thead><tbody>
      ${rows.map(([lab, r], i) => `<tr class="${i === 4 ? 'safe' : ''}"><td>${lab}</td><td style="text-align:right">${r.n} 通り</td><td class="num ${r.req === null ? 'none' : ''}">${mmText(r.req, c)}</td></tr>`).join('')}
      <tr><td>最も有利（${M.describeEdges(best.edges)}）</td><td style="text-align:right">1 通り</td><td class="num">${mmText(dist.min, c)}</td></tr>
      </tbody></table></div>`);
  s.push(`<div class="block"><h2>組合せごとの必要厚の分布</h2>
      <p class="lead">棒は、その厚さで目標を満たすようになる組合せの数です。色は梁なしの辺の数。黒い線は、その厚さで目標を満たす組合せの割合（右の目盛）です。</p>
      <div class="chart"><svg id="dist" viewBox="0 0 680 300" role="img" aria-label="必要厚の分布"></svg></div>
      <div class="legend" aria-hidden="true">梁なしの辺の数：${[0, 1, 2, 3, 4].map(k => `<span><i style="background:var(--q${k})"></i>${k}辺</span>`).join('')}</div>
      <div class="slider"><label for="cur">厚さを動かす</label><input id="cur" type="range" min="${c.hmin}" max="${c.hmax}" step="1" value="${cursor}"><span></span><output id="curOut"></output></div>
    </div>`);
  const top = list => list.map(i => { const cs = sw.combos[i], v = dist.reqs[i]; return `<div class="combo">${C.edgeIcon(cs.edges)}<span>${M.describeEdges(cs.edges)}${nPos > 1 ? `<br><span class="help">${posNote(i, v ?? c.hmax)}</span>` : ''}</span><b>${mmText(v, c)}</b></div>`; }).join('');
  const uniq = arr => arr;
  s.push(`<div class="block"><h2>厳しい組合せと有利な組合せ</h2><div class="combos">
      <div><h3 class="lead" style="font-weight:700;margin-bottom:4px">厳しい順</h3>${top(uniq(dist.order).slice(0, 4))}</div>
      <div><h3 class="lead" style="font-weight:700;margin-bottom:4px">有利な順</h3>${top(uniq([...dist.order].reverse()).slice(0, 4))}</div>
    </div></div>`);
  const m = mat(state.material);
  const recap = [
    ['目標', `LH-${c.target}`, 0], ['スラブ', `${fm(c.Lx)} × ${fm(c.Ly)} m`, 1],
    ['下の部屋', state.same ? 'スラブと同じ大きさ' : `${fm(c.rx)} × ${fm(c.ry)} m（位置は未定）`, 2],
    ['残響時間', `${c.T} 秒`, 3], ['天井高', `${c.H} m`, 4], ['材料', `${m.label}（ρ ${m.rho}・E ${fE(m.E)}×10¹⁰）`, 5]
  ];
  s.push(`<div class="block"><h2>入力した条件</h2><dl class="recap">${recap.map(([k, v, i]) => `<div><dt>${k}</dt><dd>${v}</dd><button type="button" data-goto="${i}">変更</button></div>`).join('')}</dl></div>`);
  s.push(`<div class="actions">
      <a class="btn primary" id="openDetail" href="#">詳細入力版で計算書を見る</a>
      <button type="button" class="btn" id="copy">この結果のリンクをコピー</button>
      <button type="button" class="btn" id="restart">最初からやり直す</button>
    </div>`);
  s.push(`<div class="notes"><h2 style="font-size:15px;color:var(--ink)">この結果について</h2><ul>
      <li>判定は公開資料の L-50 基準曲線（73・63・56・50 dB）と厳密に比べています（各帯域 2 dB の許容なし）。許容や基準曲線は詳細入力版で変えられます。</li>
      <li>衝撃源はタイヤ（バングマシン）。加振点は5点、加振点間は算術平均です。受音側は室内平均として扱います。</li>
      <li>「必要な等価厚」は、それ以上ならどの厚さでも目標を満たす最小値です（${c.hmin}〜${c.hmax} mm を 1 mm 刻みで計算）。</li>
      <li>予測式の検証と規格原本との照合は完了していません。設計の目安としてお使いください。式と前提は詳細入力版の計算書にあります。</li>
    </ul></div>`);
  s.push('</section>');
  $('stage').innerHTML = s.join('');
  drawDist(c);
  $('cur').addEventListener('input', e => { cursor = Number(e.target.value); drawDist(c); });
  $('stage').querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.goto), -1)));
  $('restart').addEventListener('click', () => { Object.keys(state).forEach(k => { state[k] = null; }); history.replaceState(null, '', location.pathname); go(0, -1); });
  $('copy').addEventListener('click', async () => {
    const b = $('copy');
    try { await navigator.clipboard.writeText(location.href); b.textContent = 'コピーしました'; } catch (_) { b.textContent = 'アドレスバーのURLをコピーしてください'; }
    setTimeout(() => { b.textContent = 'この結果のリンクをコピー'; }, 2200);
  });
  $('openDetail').href = detailUrl(c);
  $('stage').querySelector('[tabindex="-1"]').focus({preventScroll: true});
}

function drawDist(c) {
  const ch = C.distributionChart(sw, dist, {hmax: c.hmax, cursor});
  $('dist').innerHTML = ch.svg;
  const cov = dist.coverage(cursor);
  $('curOut').innerHTML = `<b>${cursor} mm</b> なら ${dist.n} 通り中 <b>${cov}</b> 通り（${Math.round(cov / dist.n * 100)}%）で目標を満たします。`;
}

/* ---------- URL ---------- */
function writeUrl() {
  const q = new URLSearchParams({t: state.target, Lx: state.Lx, Ly: state.Ly, same: state.same ? 1 : 0, rx: state.rx, ry: state.ry, T: state.T, H: state.H, mat: state.material});
  history.replaceState(null, '', `${location.pathname}?${q}`);
}
function detailUrl(c) {
  const m = mat(state.material);
  const q = new URLSearchParams({t: c.target, Lx: c.Lx, Ly: c.Ly, rho: m.rho, E: fE(m.E), mat: m.id, same: state.same ? 1 : 0, rx: c.rx, ry: c.ry, H: c.H, T: c.T,
    pos: 'unknown', et: 'unknown', eb: 'unknown', el: 'unknown', er: 'unknown', tol: 0, base: 'reference', avg: 'arith'});
  return `slab-thickness.html?${q}`;
}
function readUrl() {
  const q = new URLSearchParams(location.search);
  const n = k => (q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : NaN);
  const t = n('t'), Lx = n('Lx'), Ly = n('Ly'), T = n('T'), H = n('H');
  if (![t, Lx, Ly, T, H].every(Number.isFinite)) return false;
  Object.assign(state, {target: t, Lx: Math.min(Lx, Ly), Ly: Math.max(Lx, Ly), same: q.get('same') !== '0', T, H,
    material: M.MATERIALS.some(m => m.id === q.get('mat')) ? q.get('mat') : defMat.id});
  state.rx = state.same ? state.Lx : n('rx'); state.ry = state.same ? state.Ly : n('ry');
  if (!(state.rx > 0 && state.ry > 0)) return false;
  return true;
}

if (readUrl()) go(STEPS.length - 1, 1); else go(0, 1);
})();
</script>
</body>
</html>
